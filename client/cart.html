<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RentKart - Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Global background & animation */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #c2e9fb, #a1c4fd);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 10px;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Container with glassmorphism */
    .cart-container {
      width: 100%;
      max-width: 960px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      animation: bounceIn 1.2s ease;
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.95);
        opacity: 0;
      }
      60% {
        transform: scale(1.03);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    .cart-container h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #1a1a1a;
      font-size: 2rem;
      position: relative;
    }

    .cart-container h1::before {
      content: "\f07a";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      color: #0073e6;
      margin-right: 10px;
    }

    .cart-item {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
      gap: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cart-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    .cart-item img {
      width: 120px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: transform 0.3s ease;
    }

    .cart-item img:hover {
      transform: scale(1.05);
    }

    .item-details {
      flex-grow: 1;
      min-width: 200px;
    }

    .item-details h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #222;
    }

    .item-details p {
      margin: 8px 0;
      color: #444;
    }

    .item-details input[type="number"] {
      width: 60px;
      padding: 5px;
      margin-left: 5px;
      border: 1px solid #aaa;
      border-radius: 4px;
      transition: box-shadow 0.2s;
    }

    .item-details input[type="number"]:focus {
      box-shadow: 0 0 6px #0073e6;
      outline: none;
    }

    .total-price {
      font-weight: bold;
      color: #111;
    }

    .remove-btn {
      background-color: #ff4d4d;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.9rem;
      transition: background-color 0.3s;
    }

    .remove-btn i {
      margin-right: 5px;
    }

    .remove-btn:hover {
      background-color: #e60000;
    }

    .cart-summary {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 2px solid #ccc;
      text-align: right;
    }

    .cart-summary h3 {
      margin-bottom: 10px;
      font-size: 1.3rem;
      color: #222;
    }

    .cart-summary p {
      color: #333;
      margin: 4px 0;
    }

    .checkout-btn {
      background-color: #0073e6;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s, transform 0.2s;
    }

    .checkout-btn:hover {
      background-color: #005bb5;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .cart-item {
        flex-direction: column;
        align-items: center;
      }

      .item-details {
        text-align: center;
      }

      .cart-summary {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="cart-container">
    <h1>Your Rental Cart</h1>

    <div class="cart-item">
      <img src="https://tse3.mm.bing.net/th/id/OIP.Kuw2tT6BMjFfN3UpgO1j2QHaE8?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Camera" />
      <div class="item-details">
        <h2><i class="fas fa-camera"></i> Canon DSLR Camera</h2>
        <p>Price per day: ₹500</p>
        <p>Rental days: 
          <input type="number" min="1" value="3" />
        </p>
        <p class="total-price">Total: ₹1500</p>
        <button class="remove-btn"><i class="fas fa-trash"></i> Remove</button>
      </div>
    </div>

    <div class="cart-item">
      <img src="https://cdn.pixabay.com/photo/2014/07/31/23/50/bicycle-407215_1280.jpg" alt="Bicycle" />
      <div class="item-details">
        <h2><i class="fas fa-bicycle"></i> Mountain Bicycle</h2>
        <p>Price per day: ₹300</p>
        <p>Rental days: 
          <input type="number" min="1" value="2" />
        </p>
        <p class="total-price">Total: ₹600</p>
        <button class="remove-btn"><i class="fas fa-trash"></i> Remove</button>
      </div>
    </div>

    <div class="cart-summary">
      <h3><i class="fas fa-receipt"></i> Cart Summary</h3>
      <p>Total Items: 2</p>
      <p>Grand Total: ₹2100</p>
      <button class="checkout-btn"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>
    </div>
  </div>
</body>
</html>
